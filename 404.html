<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Jordan Alegant</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Self-contained on purpose: Netlify serves this for any unknown path, so it
   can't lean on index.html. Same two palettes, system serif instead of web fonts. */
:root{--bg:#FAF7F2;--text:#2C2420;--sub:#6B5E54;--fill:#9A4F1F;--fill-hover:#7F4018;--accent:#B8612A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--text:#E8E4DE;--sub:#9A958D;--fill:#C4956A;--fill-hover:#D4A87A;--accent:#C4956A;color-scheme:dark}}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;text-align:center}
.mark{font-size:1.2rem;margin-bottom:48px}
.mark span{color:var(--accent)}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:400;line-height:1.2;margin-bottom:16px}
p{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--sub);line-height:1.7;margin-bottom:32px}
a.btn{display:inline-block;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.9rem;font-weight:500;padding:14px 32px;border-radius:100px;background:var(--fill);color:var(--bg);text-decoration:none}
a.btn:hover{background:var(--fill-hover)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="mark">Jordan <span>Alegant</span></p>
  <h1>That page isn't here</h1>
  <p>The link may be old, or mistyped. Everything lives on one page.</p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
